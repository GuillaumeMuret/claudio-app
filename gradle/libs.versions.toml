[versions]
activity-compose = "1.9.3"
agp = "8.7.3"
android-driver = "1.5.5"
android-compile-sdk = "35"
android-min-sdk = "24"
android-target-sdk = "35"
buildkonfig = "0.13.3"
compose = "1.6.11"
core-ktx = "1.12.0"
exoplayer = "1.1.1"
firebase-messaging-ktx = "23.3.1"
google-services = "4.4.2"
kotlin = "2.1.0"
ktor = "2.3.6"
lifecycle-viewmodel-compose = "2.8.4"
navigation-compose = "2.7.0-alpha07"
sqldelight = "1.5.5"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
sqldelight-android-driver = { module = "com.squareup.sqldelight:android-driver", version.ref = "android-driver" }
sqldelight-native-driver = { module = "com.squareup.sqldelight:native-driver", version.ref = "android-driver" }
sqldelight-runtime = { module = "com.squareup.sqldelight:runtime", version.ref = "android-driver" }
sqldelight-sqlite-driver = { module = "com.squareup.sqldelight:sqlite-driver", version.ref = "android-driver" }
sqldelight-sqljs-driver = { module = "com.squareup.sqldelight:sqljs-driver", version.ref = "android-driver" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
firebase-messaging-ktx = { module = "com.google.firebase:firebase-messaging-ktx", version.ref = "firebase-messaging-ktx" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "exoplayer" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "exoplayer" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
codingfeline-buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
sqldelight = { id = "com.squareup.sqldelight", version.ref = "sqldelight" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
